<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玩具单词卡 · Toy Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fff3e6'/%3E%3Ccircle cx='32' cy='30' r='15' fill='%23ff4b5c'/%3E%3Crect x='22' y='44' width='20' height='6' rx='3' fill='%23ffa21f'/%3E%3C/svg%3E">
<style>
  @font-face{
    font-family:'Nunito';
    src:url('assets/fonts/nunito-var.woff2') format('woff2');
    font-weight:500 900;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --paper:#ffffff;
    --paper-2:#fdfcfa;
    --bg:#fff6e8;
    --ink:#12151c;
    --ink-2:#39414f;
    --muted:#8a93a5;
    --line:rgba(18,21,28,.12);
    --line-soft:rgba(18,21,28,.07);
    --green:#00a98f;
    --green-deep:#0b7f6c;
    --sage:#fff1f3;
    --sage-deep:#ffe3e7;
    --font-en:'Nunito', ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-zh:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --font-serif:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    --shadow-card:0 1px 0 rgba(255,255,255,.9) inset, 0 18px 34px -28px rgba(18,21,28,.5);
    --shadow-card-hover:0 1px 0 rgba(255,255,255,.9) inset, 0 26px 44px -26px rgba(18,21,28,.45);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-zh);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  body.is-locked{overflow:hidden}

  /* paper + soft garden light */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(920px 560px at 10% -8%, rgba(255,162,31,.24), transparent 64%),
      radial-gradient(780px 480px at 92% 2%, rgba(45,107,255,.14), transparent 66%),
      radial-gradient(760px 520px at 50% 104%, rgba(0,179,155,.14), transparent 64%),
      radial-gradient(90px 90px at 76% 22%, rgba(255,75,92,.10), transparent 70%),
      repeating-linear-gradient(90deg, rgba(18,21,28,.02) 0 1px, transparent 1px 88px);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.16;
    background-image:radial-gradient(rgba(18,21,28,.35) 1px, transparent 1px);
    background-size:180px 180px;
  }
  ::selection{background:#ffe3e7;color:var(--green-deep)}
  .page{position:relative;z-index:1}

  button{font-family:inherit}
  button:focus-visible,a:focus-visible{outline:2px solid #6d8a5f;outline-offset:3px}

  /* ---------- masthead ---------- */
  .masthead{
    max-width:1180px;
    margin:0 auto;
    padding:62px 40px 0;
    text-align:center;
  }
  .sprig{
    display:block;
    width:52px;
    height:24px;
    margin:0 auto 18px;
    color:#7e9670;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards;
  }
  .eyebrow{
    margin:0;
    font-family:var(--font-en);
    font-size:10px;
    font-weight:700;
    letter-spacing:.24em;
    color:#7d8d73;
    text-transform:uppercase;
    animation:rise .75s cubic-bezier(.2,.7,.2,1) .05s backwards;
  }
  .eyebrow .dot{color:#a9b8a0;margin:0 6px}
  .title-wrap{
    position:relative;
    display:inline-block;
    margin:16px 0 0;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) .1s backwards;
  }
  h1{
    margin:0;
    font-family:var(--font-serif);
    font-size:clamp(38px,4.6vw,54px);
    line-height:1.18;
    font-weight:700;
    letter-spacing:.055em;
    color:#24351f;
  }
  .badge{
    position:absolute;
    right:-86px;
    top:6px;
    width:60px;
    height:60px;
    border-radius:50%;
    border:1px dashed #a9bc9b;
    background:rgba(255,253,246,.6);
    color:#6d8361;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(9deg);
    pointer-events:none;
  }
  .badge b{font-family:var(--font-en);font-size:19px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .badge small{font-family:var(--font-en);font-size:6.5px;font-weight:800;letter-spacing:.18em;margin-top:4px}
  .lede{
    margin:18px auto 0;
    max-width:520px;
    font-size:14.5px;
    line-height:1.9;
    color:#66755e;
    text-wrap:balance;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) .16s backwards;
  }

  /* ---------- shelf / toolbar ---------- */
  .shelf{
    max-width:1180px;
    margin:42px auto 0;
    padding:0 40px;
  }
  .shelf-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:16px 2px 18px;
    border-top:1px solid var(--line-soft);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) .22s backwards;
  }
  .shelf-meta{
    display:flex;
    align-items:baseline;
    gap:10px;
    color:#5d6d54;
    font-size:12.5px;
    letter-spacing:.03em;
  }
  .shelf-meta b{
    font-family:var(--font-en);
    font-size:23px;
    font-weight:800;
    letter-spacing:-.02em;
    color:#3f5238;
  }
  .shelf-meta .pin{width:1px;height:12px;background:var(--line);margin:0 2px}
  .shelf-hint{color:#96a28d;font-size:11.5px}

  .toggle{
    appearance:none;
    border:0;
    background:transparent;
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:#6d7d64;
    font-size:12.5px;
    cursor:pointer;
    padding:6px 2px;
    border-radius:999px;
  }
  .toggle:hover{color:#42553a}
  .switch{
    width:38px;
    height:22px;
    border-radius:999px;
    background:#ccd8c2;
    position:relative;
    transition:background .25s ease;
    box-shadow:inset 0 1px 2px rgba(40,60,32,.12);
  }
  .knob{
    position:absolute;
    top:3px;
    left:3px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#fffdf7;
    box-shadow:0 1px 3px rgba(35,52,28,.28);
    transition:transform .25s cubic-bezier(.2,.8,.3,1);
  }
  .toggle[aria-checked="true"] .switch{background:#4d6a43}
  .toggle[aria-checked="true"] .knob{transform:translateX(16px)}
  .toggle[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:22px;
  }
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:0;
    padding:12px 12px 18px;
    border:1px solid var(--line-soft);
    border-radius:20px;
    background:linear-gradient(180deg,#fffefa 0%,#fffdf7 100%);
    box-shadow:var(--shadow-card);
    color:inherit;
    cursor:pointer;
    user-select:none;
    text-align:center;
    transition:transform .35s cubic-bezier(.2,.7,.3,1), box-shadow .35s ease, border-color .35s ease;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay:calc(var(--d,0) * 1ms + 280ms);
  }
  .card:hover{transform:translateY(-5px);box-shadow:var(--shadow-card-hover);border-color:rgba(61,92,52,.2)}
  .card:active{transform:translateY(-2px) scale(.997)}
  .thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    background:
      radial-gradient(120% 100% at 50% 34%, #fffefb 0%, #faf9f1 100%);
    position:relative;
    display:block;
  }
  .thumb img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    filter:drop-shadow(0 10px 11px rgba(52,77,42,.06));
    transform:scale(1);
    transition:transform .55s cubic-bezier(.2,.7,.3,1);
  }
  .card:hover .thumb img{transform:scale(1.035)}
  .card-no{
    position:absolute;
    top:18px;
    left:19px;
    z-index:2;
    font-family:var(--font-en);
    font-size:8.5px;
    font-weight:800;
    letter-spacing:.16em;
    color:#b1bda8;
  }
  .go{
    position:absolute;
    top:14px;
    right:14px;
    z-index:2;
    width:28px;
    height:28px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:rgba(238,244,232,.92);
    color:#4c6742;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .go svg{width:13px;height:13px;display:block}
  .card:hover .go,.card:focus-visible .go{opacity:1;transform:translateY(0)}
  .card-word{
    margin-top:13px;
    font-family:var(--font-en);
    font-size:18px;
    font-weight:800;
    line-height:1.2;
    letter-spacing:.005em;
    color:#24331f;
  }
  .card-ipa{
    margin-top:4px;
    font-family:var(--font-en);
    font-size:11.5px;
    font-weight:600;
    line-height:1.4;
    letter-spacing:.035em;
    color:#99a690;
  }

  /* ---------- footer ---------- */
  .colophon{
    max-width:1180px;
    margin:56px auto 0;
    padding:0 40px 52px;
    text-align:center;
  }
  .colophon .line{width:52px;height:1px;background:var(--line);margin:0 auto 20px}
  .colophon p{
    margin:0;
    font-family:var(--font-en);
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#9daa94;
  }
  .colophon .colophon-zh{
    font-family:var(--font-zh);
    letter-spacing:.08em;
    margin-top:8px;
    font-weight:400;
    color:#a8b39f;
    text-transform:none;
  }
  .colophon-link{
    color:var(--green);
    text-decoration:none;
    border-bottom:1px solid rgba(61,90,52,.28);
    padding-bottom:1px;
    transition:border-color .2s ease,color .2s ease;
  }
  .colophon-link:hover{color:var(--green-deep);border-color:var(--green-deep)}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-y:auto;
    background:rgba(25,37,22,.36);
    -webkit-backdrop-filter:blur(10px) saturate(.92);
    backdrop-filter:blur(10px) saturate(.92);
    animation:fade .3s ease both;
  }
  .overlay[hidden]{display:none!important}
  .modal{
    position:relative;
    display:grid;
    grid-template-columns:.94fr 1.06fr;
    width:min(880px,100%);
    min-height:540px;
    margin:auto;
    border-radius:30px;
    overflow:hidden;
    background:var(--paper);
    box-shadow:0 50px 100px -42px rgba(15,30,12,.65);
    outline:none;
    will-change:transform;
  }
  .art-panel{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:44px 32px 62px;
    background:
      radial-gradient(120% 100% at 50% 34%, #fbfdf6 0%, #eef4e5 100%);
    overflow:hidden;
  }
  .art-frame{
    position:absolute;
    inset:16px;
    border:1px solid rgba(57,82,47,.13);
    border-radius:20px;
    pointer-events:none;
    z-index:3;
  }
  .art-ring{
    position:absolute;
    width:min(74%,330px);
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 70%);
  }
  .art-ring::after{
    content:"";
    position:absolute;
    inset:-20px;
    border:1px dashed rgba(70,100,58,.17);
    border-radius:50%;
  }
  .art-panel img{
    position:relative;
    z-index:2;
    width:min(84%,360px);
    aspect-ratio:1/1;
    object-fit:contain;
    filter:drop-shadow(0 18px 22px rgba(50,78,40,.08));
  }
  .art-caption{
    position:absolute;
    left:36px;
    right:36px;
    bottom:28px;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:var(--font-en);
    font-size:8px;
    font-weight:800;
    letter-spacing:.19em;
    text-transform:uppercase;
    color:#86977b;
  }
  .close{
    position:absolute;
    top:18px;
    right:18px;
    z-index:6;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid rgba(57,82,47,.13);
    background:rgba(255,253,248,.72);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    color:#5a6d51;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:transform .3s ease,background .25s ease,box-shadow .25s ease;
  }
  .close:hover{background:#fffdf8;transform:rotate(90deg);box-shadow:0 6px 18px rgba(35,55,28,.1)}
  .close svg{width:15px;height:15px;display:block}

  .info{
    display:flex;
    flex-direction:column;
    min-width:0;
    padding:44px 46px 30px;
  }
  .kicker{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:var(--font-en);
    font-size:9.5px;
    font-weight:800;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:#85967a;
  }
  .kicker .kline{width:24px;height:1px;background:#ccd8c2;display:block}
  .modal-word{
    margin:20px 0 0;
    font-family:var(--font-en);
    font-size:clamp(38px,4.4vw,52px);
    font-weight:900;
    line-height:1.04;
    letter-spacing:-.025em;
    color:#1f2f1b;
    overflow-wrap:anywhere;
  }
  .ipa-row{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-top:12px;
  }
  .ipa{
    font-family:var(--font-en);
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    color:#93a189;
  }
  .speak{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    height:40px;
    padding:0 16px;
    border-radius:999px;
    border:1px solid #d6e2cc;
    background:#edf4e6;
    color:#3d5a34;
    font-family:var(--font-zh);
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    cursor:pointer;
    transition:background .25s ease,color .25s ease,border-color .25s ease,transform .2s ease;
  }
  .speak svg{width:16px;height:16px;display:block}
  .speak:hover{background:#e3edda;transform:translateY(-1px)}
  .speak.playing{background:var(--green-deep);border-color:var(--green-deep);color:#f7f4e6}
  .speak.playing::after{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:999px;
    border:1.5px solid rgba(61,90,52,.36);
    animation:ping 1.1s ease-out infinite;
  }
  .meaning{
    margin:24px 0 0;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:27px;
    line-height:1.35;
    font-weight:600;
    letter-spacing:.04em;
    color:#2c3d26;
  }
  .pos{
    flex:none;
    font-family:var(--font-en);
    font-size:9px;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#93a189;
    border:1px solid #dfe7d6;
    border-radius:999px;
    padding:4px 8px;
    line-height:1;
    transform:translateY(1px);
  }
  .rule{
    height:1px;
    margin:26px 0 20px;
    background:linear-gradient(90deg,#e2e9da 0%,rgba(226,233,218,0) 100%);
  }
  .example{
    margin:0;
    font-family:var(--font-en);
    font-size:15.5px;
    font-weight:600;
    line-height:1.7;
    color:#3a4a33;
    quotes:none;
  }
  .example::before{content:"“";color:#a9bb9d;margin-right:1px}
  .example::after{content:"”";color:#a9bb9d;margin-left:1px}
  .example-zh{
    margin:7px 0 0;
    font-size:12.5px;
    line-height:1.75;
    color:#8d9a84;
    letter-spacing:.02em;
  }
  .modal-foot{
    margin-top:auto;
    padding-top:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .hint{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:10.5px;
    color:#a0ac97;
    letter-spacing:.02em;
  }
  kbd{
    display:inline-block;
    font-family:var(--font-en);
    font-size:9.5px;
    font-weight:700;
    line-height:1;
    padding:3px 5px;
    border:1px solid #dfe6d8;
    border-bottom-width:2px;
    border-radius:5px;
    background:#f9fbf6;
    color:#7d8c74;
  }
  .nav{display:flex;gap:8px;flex:none}
  .nav button{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid #dfe7d6;
    background:#fffdf8;
    color:#5b6f52;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  .nav button:hover{background:var(--sage);border-color:#cfdbc4;transform:translateY(-1px)}
  .nav button svg{width:15px;height:15px;display:block}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    z-index:80;
    transform:translate(-50%,14px);
    padding:11px 18px;
    border-radius:999px;
    background:rgba(34,52,29,.94);
    color:#f4f2e6;
    font-size:12px;
    letter-spacing:.04em;
    box-shadow:0 16px 32px -16px rgba(20,35,16,.6);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- auto play banner ---------- */
  .autoplay-banner{
    position:fixed;
    left:50%;
    top:22px;
    z-index:90;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px 9px 16px;
    border-radius:999px;
    background:rgba(34,52,29,.94);
    color:#f4f2e6;
    font-family:var(--font-en);
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    box-shadow:0 18px 34px -18px rgba(20,35,16,.75);
    animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;
  }
  .autoplay-banner b{font-size:12px;color:#cfe3bd}
  .ap-dot{
    width:8px;height:8px;border-radius:50%;
    background:#9ecb7a;
    box-shadow:0 0 0 0 rgba(158,203,122,.7);
    animation:apPing 1.6s ease-out infinite;
  }
  @keyframes apPing{
    0%{box-shadow:0 0 0 0 rgba(158,203,122,.6)}
    70%{box-shadow:0 0 0 9px rgba(158,203,122,0)}
    100%{box-shadow:0 0 0 0 rgba(158,203,122,0)}
  }
  .ap-stop{
    border:1px solid rgba(244,242,230,.28);
    background:rgba(244,242,230,.1);
    color:#f4f2e6;
    font-family:var(--font-zh);
    font-size:11px;
    padding:4px 11px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .ap-stop:hover{background:rgba(244,242,230,.22)}

  /* ---------- motion ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes ping{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.16)}}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  }
  @media (max-width:880px){
    .masthead{padding-top:48px}
    .badge{display:none}
    .modal{grid-template-columns:1fr;width:min(500px,100%);min-height:0;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto}
    .art-panel{height:250px;padding:22px 24px 44px}
    .art-panel img{width:min(58%,196px)}
    .art-frame{inset:10px}
    .art-caption{left:24px;right:24px;bottom:16px}
    .art-ring{width:190px}
    .art-ring::after{inset:-14px}
    .close{top:12px;right:12px}
    .info{padding:28px 28px 24px}
    .modal-word{font-size:clamp(36px,9vw,44px);margin-top:14px}
    .ipa-row{margin-top:8px;gap:12px}
    .meaning{font-size:23px;margin-top:18px}
    .rule{margin:20px 0 16px}
    .modal-foot{padding-top:24px}
    .hint{display:none}
    .example{font-size:14.5px}
    .modal-foot{justify-content:flex-end}
  }
  @media (max-width:720px){
    .masthead{padding:44px 22px 0}
    .shelf{padding:0 22px;margin-top:34px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .card{padding:9px 9px 15px;border-radius:16px}
    .thumb{border-radius:11px}
    .card-word{font-size:15.5px;margin-top:11px}
    .card-ipa{font-size:10.5px}
    .card-no{top:13px;left:14px;font-size:8px}
    .go{display:none}
    .colophon{padding:0 22px 38px;margin-top:42px}
    .overlay{padding:12px}
    .lede{font-size:13.5px;max-width:360px}
    .shelf-hint{display:none}
    .eyebrow{font-size:8.5px;letter-spacing:.2em}
  }
  @media (max-width:430px){
    .info{padding:24px 22px 22px}
    .modal-word{font-size:34px}
    .meaning{font-size:21px}
    .art-panel{height:220px}
    .art-panel img{width:min(54%,168px)}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <svg class="sprig" viewBox="0 0 52 24" fill="none" aria-hidden="true">
      <path d="M3 20C15 19 30 14 49 5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M18.5 12.6C16.9 8.9 18 5.6 21.6 3.2c2.1 2.3 2.6 5.1 1.4 7.6-2.2 1.6-3.8 1.5-4.5 1.8Z" fill="currentColor" opacity=".55"/>
      <path d="M28.6 8.2c.2-3.2 1.9-5.8 5.8-7 1.2 2.9.7 5.5-1.2 7.4-2.5 1.1-3.9.4-4.6-.4Z" fill="currentColor" opacity=".38"/>
      <path d="M12.8 16.7c-1.5 1.1-3.2 1.5-5.2 1.3" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity=".55"/>
    </svg>
    <p class="eyebrow">Toy Box <span class="dot">·</span> Play &amp; Learn</p>
    <div class="title-wrap">
      <h1>玩具单词卡</h1>
      <span class="badge" aria-hidden="true"><b>24</b><small>CARDS</small></span>
    </div>
    <p class="lede">24 张写实卡片。点开一张，听发音、看释义，<br class="br">把玩具盒里的英语带回家。</p>
  </header>

  <section class="shelf" aria-label="玩具单词卡">
    <div class="shelf-head">
      <div class="shelf-meta">
        <b>24</b><span>张卡片</span><span class="pin"></span>
        <span class="shelf-hint">点击任意一张开始</span>
      </div>
      <button class="toggle" id="autoSpeak" role="switch" aria-checked="true" aria-label="打开卡片时自动发音">
        <span>自动发音</span>
        <span class="switch" aria-hidden="true"><span class="knob"></span></span>
      </button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="colophon">
    <div class="line"></div>
    <p>Toy Box <span aria-hidden="true">·</span> Realistic Toy Cards</p>
    <p class="colophon-zh">语音由浏览器本地合成 · 支持 ← → 浏览 ·
      <a class="colophon-link" href="vertical.html">竖屏播放</a> ·
      <a class="colophon-link" href="?autoplay=1">自动翻卡</a>
    </p>
  </footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalWord" tabindex="-1">
    <button class="close" id="closeBtn" aria-label="关闭卡片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="art-panel">
      <span class="art-ring" aria-hidden="true"></span>
      <img id="modalImg" src="assets/img/teddy-bear.webp" alt="teddy bear">
      <span class="art-frame" aria-hidden="true"></span>
      <div class="art-caption" aria-hidden="true"><span>Toy Box</span><span>Studio Study</span></div>
    </div>
    <div class="info" id="info">
      <div class="kicker">
        <span>Toy</span><span class="kline" aria-hidden="true"></span><span id="modalIndex">01 / 24</span>
      </div>
      <h2 class="modal-word" id="modalWord">teddy bear</h2>
      <div class="ipa-row">
        <span class="ipa" id="modalIpa">/ˈtedi ber/</span>
        <button class="speak" id="speakBtn" aria-label="朗读 teddy bear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.4v5.2a1 1 0 0 0 1 1h3l4.1 3.2V5.2L8 8.4H5a1 1 0 0 0-1 1Z"/>
            <path d="M16.2 8.6a4.6 4.6 0 0 1 0 6.8"/>
            <path d="M18.9 6a8.2 8.2 0 0 1 0 12"/>
          </svg>
          <span>朗读</span>
        </button>
      </div>
      <p class="meaning"><span class="pos">n.</span><span id="modalZh">泰迪熊</span></p>
      <div class="rule"></div>
      <p class="example"><span id="modalExample">She hugs her teddy bear every night.</span></p>
      <p class="example-zh" id="modalExampleZh">她每晚都抱着她的泰迪熊。</p>
      <div class="modal-foot">
        <span class="hint"><kbd>←</kbd><kbd>→</kbd> 浏览 <span aria-hidden="true">·</span> <kbd>空格</kbd> 重听</span>
        <div class="nav">
          <button id="prevBtn" aria-label="上一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button id="nextBtn" aria-label="下一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script>

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const info = document.getElementById('info');
const modalWord = document.getElementById('modalWord');
const modalIpa = document.getElementById('modalIpa');
const modalZh = document.getElementById('modalZh');
const modalExample = document.getElementById('modalExample');
const modalExampleZh = document.getElementById('modalExampleZh');
const modalImg = document.getElementById('modalImg');
const modalIndex = document.getElementById('modalIndex');
const speakBtn = document.getElementById('speakBtn');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const toggle = document.getElementById('autoSpeak');
const toastEl = document.getElementById('toast');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const hasSpeech = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

let current = 0;
let isOpen = false;
let cards = [];
let voices = [];
let speakTimer = null;
let speakToken = 0;

const pad = n => String(n + 1).padStart(2, '0');

/* ---------- build the card wall ---------- */
DATA.forEach((d, i) => {
  const card = document.createElement('button');
  card.className = 'card';
  card.type = 'button';
  card.dataset.index = i;
  card.style.setProperty('--d', i * 26);
  card.setAttribute('aria-label', `${d.name}，${d.zh}，打开单词卡`);
  card.innerHTML = `
    <span class="card-no" aria-hidden="true">${pad(i)}</span>
    <span class="go" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </span>
    <span class="thumb"><img src="${d.img}" alt="${d.name}" decoding="async"></span>
    <span class="card-word">${d.name}</span>
    <span class="card-ipa">${d.ipa}</span>`;
  grid.appendChild(card);
});
cards = [...grid.querySelectorAll('.card')];

/* ---------- speech ---------- */
function loadVoices(){
  if (!hasSpeech) return;
  voices = window.speechSynthesis.getVoices();
}
if (hasSpeech) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(){
  const english = voices.filter(v => /^en[-_]/i.test(v.lang));
  return english.find(v => /Samantha|Ava|Allison|Serena|Google US English|Microsoft (Aria|Jenny|Guy)/i.test(v.name))
    || english.find(v => /^en[-_]US/i.test(v.lang))
    || english[0] || null;
}

function setSpeaking(on){
  speakBtn.classList.toggle('playing', on);
  clearTimeout(speakTimer);
  if (on) speakTimer = setTimeout(() => speakBtn.classList.remove('playing'), 5000);
}

function stopSpeech(){
  speakToken++;
  if (hasSpeech) window.speechSynthesis.cancel();
  clearTimeout(speakTimer);
  speakBtn.classList.remove('playing');
}

function speak(text){
  if (!hasSpeech) {
    toast('当前浏览器不支持语音朗读');
    return;
  }
  window.speechSynthesis.cancel();
  clearTimeout(speakTimer);
  const token = ++speakToken;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  u.pitch = 1;
  const v = pickVoice();
  if (v) u.voice = v;
  u.onstart = () => { if (token === speakToken) setSpeaking(true); };
  u.onend = () => { if (token === speakToken) setSpeaking(false); };
  u.onerror = () => { if (token === speakToken) setSpeaking(false); };
  speakBtn.classList.remove('playing');
  setTimeout(() => {
    if (token !== speakToken) return;
    window.speechSynthesis.speak(u);
    setSpeaking(true);
  }, 50);
}

function speakCurrent(){
  speak(DATA[current].name);
}

/* auto-speak preference */
let autoSpeak = true;
try { autoSpeak = localStorage.getItem('pg-auto-speak') !== 'off'; } catch (e) {}
toggle.setAttribute('aria-checked', String(autoSpeak));
if (!hasSpeech) {
  autoSpeak = false;
  toggle.setAttribute('aria-checked', 'false');
  toggle.setAttribute('aria-disabled', 'true');
}
toggle.addEventListener('click', () => {
  if (!hasSpeech) { toast('当前浏览器不支持语音朗读'); return; }
  autoSpeak = !autoSpeak;
  toggle.setAttribute('aria-checked', String(autoSpeak));
  try { localStorage.setItem('pg-auto-speak', autoSpeak ? 'on' : 'off'); } catch (e) {}
  if (autoSpeak && isOpen) speakCurrent();
});

/* ---------- modal ---------- */
function render(i){
  const d = DATA[i];
  modalWord.textContent = d.name;
  modalIpa.textContent = d.ipa;
  modalZh.textContent = d.zh;
  modalExample.textContent = d.example;
  modalExampleZh.textContent = d.exampleZh;
  modalIndex.textContent = `${pad(i)} / ${DATA.length}`;
  modalImg.src = d.img;
  modalImg.alt = d.name;
  speakBtn.setAttribute('aria-label', `朗读 ${d.name}`);
}

function openModal(i, sourceCard){
  if (isOpen) return;
  current = i;
  render(i);
  isOpen = true;

  overlay.hidden = false;
  document.body.classList.add('is-locked');
  overlay.getAnimations().forEach(a => { if (!a.animationName) a.cancel(); });
  modal.getAnimations().forEach(a => a.cancel());
  const src = sourceCard || cards[i];
  const sr = src.getBoundingClientRect();
  modal.focus({ preventScroll: true });

  requestAnimationFrame(() => {
    if (!reduceMotion) {
      const pr = modal.getBoundingClientRect();
      const dx = sr.left + sr.width / 2 - (pr.left + pr.width / 2);
      const dy = sr.top + sr.height / 2 - (pr.top + pr.height / 2);
      const sx = Math.max(sr.width / pr.width, .08);
      const sy = Math.max(sr.height / pr.height, .08);
      modal.animate([
        { transform:`translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, opacity:.5, borderRadius:'18px' },
        { transform:'translate(0,0) scale(1,1)', opacity:1, borderRadius:'30px' }
      ], { duration:480, easing:'cubic-bezier(.22,.85,.28,1)' });
      info.animate([
        { opacity:0, transform:'translateY(10px)' },
        { opacity:1, transform:'translateY(0)' }
      ], { duration:420, delay:130, easing:'cubic-bezier(.2,.7,.2,1)', fill:'backwards' });
    }
    if (autoSpeak) {
      setTimeout(() => { if (isOpen) speakCurrent(); }, reduceMotion ? 80 : 460);
    }
  });
}

function closeModal(){
  if (!isOpen) return;
  isOpen = false;
  stopSpeech();
  overlay.getAnimations({ subtree:true }).forEach(a => a.cancel());

  const card = cards[current];
  const cr = card.getBoundingClientRect();
  const onScreen = cr.bottom > 0 && cr.top < window.innerHeight;
  const pr = modal.getBoundingClientRect();
  const dx = cr.left + cr.width / 2 - (pr.left + pr.width / 2);
  const dy = cr.top + cr.height / 2 - (pr.top + pr.height / 2);
  const sx = Math.max(cr.width / pr.width, .06);
  const sy = Math.max(cr.height / pr.height, .06);

  const finish = () => {
    overlay.hidden = true;
    document.body.classList.remove('is-locked');
    card.focus({ preventScroll: true });
  };

  if (reduceMotion || !onScreen) {
    const fade = overlay.animate([{ opacity:1 }, { opacity:0 }], { duration:180, easing:'ease-out', fill:'forwards' });
    fade.onfinish = finish;
    if (reduceMotion) finish();
    return;
  }

  overlay.animate([{ opacity:1 }, { opacity:0 }], { duration:240, easing:'ease-out', fill:'forwards' });
  const back = modal.animate([
    { transform:'translate(0,0) scale(1,1)', opacity:1 },
    { transform:`translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, opacity:.15 }
  ], { duration:260, easing:'cubic-bezier(.4,0,.72,.32)' });
  back.onfinish = finish;
}

function go(delta){
  if (!isOpen) return;
  stopSpeech();
  current = (current + delta + DATA.length) % DATA.length;
  render(current);
  if (!reduceMotion) {
    info.getAnimations().forEach(a => a.cancel());
    info.animate([
      { opacity:0, transform:`translateY(${delta > 0 ? 8 : -8}px)` },
      { opacity:1, transform:'translateY(0)' }
    ], { duration:280, easing:'cubic-bezier(.2,.7,.2,1)' });
    modalImg.animate([{ opacity:.2 }, { opacity:1 }], { duration:260, easing:'ease-out' });
  }
  if (autoSpeak) setTimeout(() => { if (isOpen) speakCurrent(); }, 180);
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openModal(Number(card.dataset.index), card);
});
closeBtn.addEventListener('click', closeModal);
prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));
speakBtn.addEventListener('click', speakCurrent);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

document.addEventListener('keydown', e => {
  if (!isOpen) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); return; }
  if (e.key === ' ' && document.activeElement === modal) { e.preventDefault(); speakCurrent(); return; }
  if (e.key === 'Tab') {
    const f = [...modal.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')]
      .filter(el => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === modal)) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }
});

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* preload the modal art once the first screen is settled */
window.addEventListener('load', () => {
  DATA.slice(1).forEach(d => { const im = new Image(); im.src = d.img; });
});

/* ---------- auto play: open every card in order, ?autoplay=1 ---------- */
const query = new URLSearchParams(location.search);
if (query.has('autoplay')) {
  const dwell = Math.max(800, Number(query.get('dwell')) || 3000);
  let autoIndex = 0, autoTimer = null, banner = null, counter = null;

  function makeBanner(){
    banner = document.createElement('div');
    banner.className = 'autoplay-banner';
    banner.innerHTML = `<span class="ap-dot" aria-hidden="true"></span>
      <span>自动播放 <b id="apCount">1 / ${DATA.length}</b></span>
      <button type="button" class="ap-stop">停止</button>`;
    document.body.appendChild(banner);
    counter = banner.querySelector('#apCount');
    banner.querySelector('.ap-stop').addEventListener('click', () => stopAuto('已停止自动播放'));
  }

  function stopAuto(msg){
    clearTimeout(autoTimer); autoTimer = null;
    if (banner) { banner.remove(); banner = null; }
    if (msg) toast(msg);
  }

  function autoTick(){
    if (!banner) return;
    if (isOpen) closeModal();
    autoTimer = setTimeout(() => {
      if (!banner) return;
      openModal(autoIndex, cards[autoIndex]);
      counter.textContent = `${autoIndex + 1} / ${DATA.length}`;
      autoTimer = setTimeout(() => {
        autoIndex = (autoIndex + 1) % DATA.length;
        if (autoIndex === 0 && !query.has('loop')) { stopAuto(`播放完成 · 共 ${DATA.length} 张卡片`); return; }
        autoTick();
      }, dwell);
    }, isOpen ? 340 : 0);
  }

  makeBanner();
  /* any real interaction hands control back to the visitor */
  document.addEventListener('pointerdown', e => {
    if (banner && !e.target.closest('.autoplay-banner')) stopAuto('已停止自动播放');
  }, true);
  document.addEventListener('keydown', e => { if (banner && !e.altKey) stopAuto('已停止自动播放'); });
  autoTick();
}
</script>
</body>
</html>
